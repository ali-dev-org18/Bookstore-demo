{% extends 'base.html' %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h2>Checkout</h2>
<form method="post">
  {% csrf_token %}
  <div class="mb-3"><label>Full name</label><input name="full_name" class="form-control" required></div>
  <div class="mb-3"><label>Phone</label><input name="phone" class="form-control" required></div>
  <div class="mb-3"><label>Address</label><textarea name="address" class="form-control" required></textarea></div>
  <p>Total: ${{ cart.total_price }}</p>
  <button class="btn btn-accent">Place Order</button>
</form>
{% endblock %}
